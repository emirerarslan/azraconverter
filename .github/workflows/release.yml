name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
          choco install tesseract innosetup winrar --yes --no-progress

      - name: Run conversion tests
        shell: powershell
        run: python -m unittest discover -s tests -v

      - name: Build application
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name "AZRA CONVERTER" `
            --icon "azra_gold.ico" `
            --add-data "azra_gold.ico;." `
            --add-data "azra_gold_logo_real_transparent.png;." `
            --add-data "C:\Program Files\Tesseract-OCR;tesseract" `
            main.py

      - name: Create in-app update package
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath update_config.json -Destination "dist\AZRA CONVERTER\update_config.json" -Force
          Copy-Item -LiteralPath azra_gold.ico -Destination "dist\AZRA CONVERTER\azra_gold.ico" -Force
          Compress-Archive -Path "dist\AZRA CONVERTER\*" `
            -DestinationPath "release\AZRA-CONVERTER-UPDATE-$version.zip" `
            -CompressionLevel Optimal -Force

      - name: Build installer
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $scriptPath = "setup_azra_premium_v2_fixed_1.0.2.iss"
          $script = Get-Content -Raw -LiteralPath $scriptPath
          $script = $script -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`""
          $script = $script -replace 'OutputBaseFilename=AZRA-CONVERTER-SETUP-[^\r\n]+', "OutputBaseFilename=AZRA-CONVERTER-SETUP-$version"
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding utf8

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc $scriptPath

      - name: Create release manifest
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = "installer/AZRA-CONVERTER-SETUP-$version.exe"
          $package = "release/AZRA-CONVERTER-UPDATE-$version.zip"
          $distribution = "release/AZRA-CONVERTER-$version-DAGITIM.rar"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not produced: $installer"
          }
          if (-not (Test-Path -LiteralPath $package)) {
            throw "In-app update package was not produced: $package"
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          $packageSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()

          $rar = "C:\Program Files\WinRAR\Rar.exe"
          if (-not (Test-Path -LiteralPath $rar)) {
            throw "WinRAR command-line tool was not found."
          }
          & $rar a -ep1 -m5 -idq $distribution $installer "DAGITIM_KURULUM.txt"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $distribution)) {
            throw "RAR distribution package could not be produced."
          }
          $distributionSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $distribution).Hash.ToLowerInvariant()

          $manifest = [ordered]@{
            version = $version
            download_url = "https://github.com/emirerarslan/azraconverter/releases/latest/download/AZRA-CONVERTER-SETUP-$version.exe"
            sha256 = $sha256
            package_url = "https://github.com/emirerarslan/azraconverter/releases/latest/download/AZRA-CONVERTER-UPDATE-$version.zip"
            package_sha256 = $packageSha256
            distribution_url = "https://github.com/emirerarslan/azraconverter/releases/latest/download/AZRA-CONVERTER-$version-DAGITIM.rar"
            distribution_sha256 = $distributionSha256
            notes = "Arayüz ve kurulum ekranındaki desteklenmeyen simgeler kaldırıldı; dağıtım paketi ve yeni ikon iyileştirildi."
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath release/version.json -Encoding utf8
          @(
            "$sha256  AZRA-CONVERTER-SETUP-$version.exe"
            "$packageSha256  AZRA-CONVERTER-UPDATE-$version.zip"
            "$distributionSha256  AZRA-CONVERTER-$version-DAGITIM.rar"
          ) | Set-Content -LiteralPath release/checksums.sha256 -Encoding ascii

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          gh release create $env:GITHUB_REF_NAME `
            "installer/AZRA-CONVERTER-SETUP-$version.exe" `
            "release/AZRA-CONVERTER-UPDATE-$version.zip" `
            "release/AZRA-CONVERTER-$version-DAGITIM.rar" `
            "release/version.json" `
            "release/checksums.sha256" `
            --title "Azra Converter $version" `
            --notes "Desteklenmeyen dekoratif simgeler kaldırıldı, kurulum metinleri güvenli karakterlerle güncellendi ve dağıtıma hazır RAR paketi eklendi."
